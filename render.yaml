services:
  - type: web
    name: koulango-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  - type: web
    name: koulango-admin
    runtime: static
    rootDir: ./web-admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://koulango-dictionnary.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
